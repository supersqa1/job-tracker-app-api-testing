name: API Tests

on: push

jobs:
  api-tests:
    name: Run API Test Suite - V1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v5

      - name: Checkout application code
        uses: actions/checkout@v5
        with: 
          repository: supersqa1/job-tracker-app-for-testing
          path: app-under-test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"    

      - name: debug
        run: |
          pwd
          ls -la
          which -a python3
          python3 --version

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run api tests
        run: python3 -m pytest tests