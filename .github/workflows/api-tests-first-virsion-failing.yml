name: API Tests

on: push

jobs:
  api-tests:
    name: Run API Test Suite - V1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v5
    
      - name: debug
        run: |
          pwd
          ls -la
          which -a python3
          python3 --version
  
      - name: Run api tests
        run: python3 -m pytest tests