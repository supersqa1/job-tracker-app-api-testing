name: API Tests - Main

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Test Suite
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ${{ github.workspace }}/app-under-test/backend/data/job_tracker.db

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          repository: supersqa1/job-tracker-app-for-testing
          path: app-under-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install App Dependencies
        working-directory: app-under-test/backend
        run: pip install -r requirements.txt

      - name: Run The Application Under Test
        working-directory: app-under-test/backend
        run: |
          cp .env.example .env
          uvicorn app.main:app --host 0.0.0.0 --port 3050 &

      - name: Wait for API app
        run: |
          for i in {1..30}; do
            curl -f http://localhost:3050/api/v1/public/status && exit 0
            sleep 2
          done
          echo "API app did not start in time"
          exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run api tests
        run: |
          mkdir -p reports
          python3 -m pytest tests --html=reports/api-test-report.html --self-contained-html

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/
